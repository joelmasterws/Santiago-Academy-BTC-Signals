name: Santiago Academy Daily BTC Signal

on:
  workflow_dispatch:
  schedule:
    # Start the 30-minute review at 1:00 AM Pacific (PDT / PST).
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'

permissions:
  contents: read

concurrency:
  group: santiago-academy-btc-daily
  cancel-in-progress: false

jobs:
  send-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Select correct Pacific schedule (manual tests always run)
        id: timing
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          pacific = ZoneInfo('America/Los_Angeles')
          # Check offset for the Pacific date of the intended schedule, not the delayed runner time.
          now = datetime.now(timezone.utc)
          day = now.astimezone(pacific).date()
          local_one = datetime(day.year, day.month, day.day, 1, 0, tzinfo=pacific)
          expected = '0 8 * * *' if local_one.utcoffset().total_seconds() == -7 * 3600 else '0 9 * * *'
          event = os.environ['EVENT_NAME']
          selected = event == 'workflow_dispatch' or (event == 'schedule' and os.environ.get('SCHEDULE') == expected)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"run_signal={'true' if selected else 'false'}\n")
          print(f'Pacific time: {now.astimezone(pacific).isoformat()}; event={event}; expected={expected}; selected={selected}')
          PY
      - name: Check out repository
        if: steps.timing.outputs.run_signal == 'true'
        uses: actions/checkout@v4
      - name: Set up Python
        if: steps.timing.outputs.run_signal == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and verify dependencies
        if: steps.timing.outputs.run_signal == 'true'
        run: |
          python -m pip install -r requirements.txt
          python -c 'import requests, pandas, numpy; print("Python dependencies verified")'
      - name: Monitor BTC 1:00–1:30 AM Pacific and post premium signal
        if: steps.timing.outputs.run_signal == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python -u btc_signal.py
